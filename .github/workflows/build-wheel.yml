name: Build Python Wheel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/hello.py'
      - '.github/workflows/build-wheel.yml'

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run hello.py
        run: python src/hello.py --name "GitHub Actions"
