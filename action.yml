name: Hello, World!
description: Greet someone and record the time
author: GitHub Actions

# Define your inputs here.
inputs:
  python:
    description: Configure the python command
    required: false
    default: 'uv run --no-managed-python python'

  mode:
    description: What kind of package to build
    required: true
    type: choice
    options:
      - beta
      - release
      - post
    default: release
    
  files:
    description: Files to apply @VAR@ replacement
    required: false

  move:
    description: move the dist directory after build
    required: false
    default: ""

  debug:
    description: Dumps data
    required: false
    default: false

# Define your outputs here.
outputs:
  python_wheel:
    description: The path to the wheel file

runs:
  using: composite
  steps:

    # https://github.com/actions/checkout
    - name: Checkout build-wheel code
      uses: actions/checkout@v7

    - name: Internal check
      if: ${{ inputs.debug }}
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}/src
      run: |
        ${{ inputs.python }} -m action_build_wheel_support.info

    - name: Run build-wheel code
      env:
        GITHUB_DUMP: |
          {
            "event": {
              "repository": {
                "name": "${{ github.event.repository.name }}",
                "default_branch": "${{ github.event.repository.default_branch }}",
                "html_url": "${{ github.event.repository.html_url }}"
              }
            },
            "ref": "${{ github.ref }}",
            "sha": "${{ github.sha }}",
            "run_number": "${{ github.run_number }}",
            "ref_name": "${{ github.ref_name }}",
            "repository": "${{ github.repository }}",
            "workflow_ref": "${{ github.workflow_ref }}"
          }
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}/src
      run: |
        FILES=$(echo "${{ inputs.files }}" | tr '\n' ' ')
        ${{ inputs.python }} -m action_build_wheel_support.builder ${{ inputs.mode }} $FILES

    - name: Run build-wheel code
      if: ${{ inputs.move }}
      shell: bash
      run: |
        mkdir -p ${{ inputs.move }}
        mv dist ${{ inputs.move }}
        
    
    
