name: Hello, World!
description: Greet someone and record the time
author: GitHub Actions

# Define your inputs here.
inputs:
  mode:
    description: What kind of package to build
    required:
    type: choice
    options:
      - beta
      - release
      - post
    default: release
    
  files:
    description: Files to apply @VAR@ replacement
    required: false

# Define your outputs here.
outputs:
  python_wheel:
    description: The path to the wheel file

runs:
  using: composite
  steps:

    # https://github.com/actions/checkout
    - name: Checkout build-wheel code
      uses: actions/checkout@v7

    - name: Run build-wheel code
      shell: bash
      run: |
        PYTHONPATH=${{ github.action_path }}/src python -m support.builder "${{ inputs.mode }}" ${{ inputs.files }}
    
    - name: Set output
      shell: bash
      run: |
        echo "python_wheel=$(date)" >> $GITHUB_OUTPUT
